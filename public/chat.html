<!DOCTYPE html>
<html lang="en">
<head>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sour+Gummy:wght@300..900&family=Nunito:wght@400;600;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/style.css" />

<meta name="theme-color" content="#7151a8" />
<style>
  .chat-main {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 20px 60px;
    display: flex;
    flex-direction: column;
    height: calc(100vh - 150px);
    min-height: 420px;
  }

  .chat-header-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 0 14px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .chat-title {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 20px;
    color: var(--text);
  }

  .chat-online {
    font-size: 13px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .chat-online-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 6px var(--accent-glow);
  }

  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
    scroll-behavior: smooth;
  }

  .chat-messages::-webkit-scrollbar { width: 5px; }
  .chat-messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .chat-msg { display: flex; flex-direction: column; gap: 2px; max-width: 100%; }

  .chat-msg-meta { display: flex; align-items: baseline; gap: 8px; }

  .chat-msg-name {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 13px;
    color: var(--accent-bright);
  }

  .chat-msg.mine .chat-msg-name { color: var(--accent); }

  .chat-msg-time { font-size: 11px; color: var(--text-muted); }

  .chat-msg-text {
    font-size: 14px;
    color: var(--text);
    line-height: 1.5;
    word-break: break-word;
    padding: 8px 12px;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 0 12px 12px 12px;
    display: inline-block;
    max-width: 85%;
  }

  .chat-msg.mine { align-items: flex-end; }
  .chat-msg.mine .chat-msg-meta { flex-direction: row-reverse; }
  .chat-msg.mine .chat-msg-text {
    background: var(--accent-glow);
    border-color: var(--accent);
    border-radius: 12px 0 12px 12px;
  }

  .chat-sys {
    font-size: 12px;
    color: var(--text-muted);
    text-align: center;
    padding: 4px 0;
    font-style: italic;
  }

  .chat-input-area {
    flex-shrink: 0;
    padding: 14px 0 0;
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .chat-name-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--text-muted);
  }

  .chat-name-input {
    background: var(--bg-elevated);
    border: 2px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: var(--font-body);
    font-size: 13px;
    padding: 5px 10px;
    width: 150px;
    outline: none;
    transition: border-color 0.15s;
  }

  .chat-name-input:focus { border-color: var(--accent); }

  .chat-send-row { display: flex; gap: 8px; }

  .chat-text-input {
    flex: 1;
    background: var(--bg-elevated);
    border: 2px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: var(--font-body);
    font-size: 14px;
    padding: 10px 14px;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }

  .chat-text-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }

  .chat-text-input::placeholder { color: var(--text-muted); }

  .chat-send-btn {
    background: var(--accent);
    border: none;
    border-radius: 10px;
    color: var(--bg);
    font-family: var(--font-body);
    font-size: 14px;
    font-weight: 700;
    padding: 10px 20px;
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    transition: background 0.15s;
  }

  .chat-send-btn:hover { background: var(--accent-bright); }
</style>
</head>
<body>

<script src="/cloak.js"></script>
<script src="/panic.js"></script>

<script src="/transitions.js"></script>
<script src="/sticky-nav.js"></script>

  <button id="scrollTop" class="scroll-top" type="button" aria-label="Scroll to top">
    <span class="material-symbols-rounded">arrow_upward</span>
  </button>
  <div class="topbar-right" style="margin-left: auto;">
    <button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle theme">
      <span class="material-symbols-rounded">dark_mode</span>
    </button>
  </div>
</header>

<nav class="site-nav" style="justify-content: center; padding: 0 20px 20px;">

</nav>

<main class="chat-main">
  <div class="chat-header-bar">
    <span class="chat-title">global chat</span>
    <span class="chat-online">
      <span class="chat-online-dot"></span>
      <span id="chatOnlineCount">… online</span>
    </span>
  </div>

  <div class="chat-messages" id="chatMessages">
    <div class="chat-sys">connecting…</div>
  </div>

  <div class="chat-input-area">
    <div class="chat-name-row">
      chatting as <input class="chat-name-input" id="chatNameInput" maxlength="24" />
    </div>
    <div class="chat-send-row">
      <input class="chat-text-input" id="chatTextInput" placeholder="say something…" maxlength="500" autocomplete="off" />
      <button class="chat-send-btn" id="chatSendBtn" type="button">
        <span class="material-symbols-rounded" style="font-size: 18px;">send</span>
        send
      </button>
    </div>
  </div>
</main>

<script src="/chat.js"></script>
</body>
