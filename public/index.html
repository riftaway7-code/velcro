<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>velcro</title>
<link rel="icon" href="data:," />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
<link rel="stylesheet" href="desktop/css/theme.css">
<link rel="stylesheet" href="desktop/css/style.css">
</head>
<body>
  <script src="/cloak.js"></script>
<script src="/panic.js"></script>
<script src="/a11y.js"></script>

  <div id="wp" aria-hidden="true"></div>

  <header id="bar">
    <div class="bar-left">
      <button class="ws ws-keys" data-app="terminal">Keys</button>
      <div class="ws-group">
        <button class="ws" data-app="terminal"><span class="msym">terminal</span> term</button>
        <button class="ws ws-on" data-app="web"><span class="msym">public</span> web</button>
        <button class="ws" data-app="games"><span class="msym">sports_esports</span> games</button>
        <button class="ws" data-app="movies"><span class="msym">movie</span> movies</button>
        <button class="ws" data-app="vapps"><span class="msym">apps</span> apps</button>
      </div>
      <div class="pins" id="pins"></div>
    </div>

    <button class="bar-clock" id="clock" type="button">&mdash;</button>

    <div class="bar-right">
      <span class="tray" id="tray-wifi" title="network"><span class="msym">wifi</span></span>
      <span class="tray" id="tray-weather" title="weather"><span class="msym" id="wx-icon">partly_cloudy_day</span> <span id="wx-temp">&mdash;</span></span>
      <button class="tray tag" id="tray-anko">velcro</button>
      <button class="tray" id="tray-bell" title="notifications"><span class="msym">notifications</span></button>
      <button class="tray" id="tray-eye" title="idle inhibit"><span class="msym">visibility</span></button>
      <button class="tray" id="tray-gear" title="settings"><span class="msym">settings</span></button>
      <span class="tray"><span class="msym">sports_esports</span></span>
      <span class="tray"><span class="msym">keyboard</span></span>
    </div>
  </header>

  <nav id="dock">
    <button id="plasma" class="dock-btn" title="Application launcher">
      <span class="kde" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none">
          <path d="M12 2 L20.5 7 V17 L12 22 L3.5 17 V7 Z" fill="currentColor" opacity="0.16"/>
          <path d="M12 2 L20.5 7 V17 L12 22 L3.5 17 V7 Z" stroke="currentColor" stroke-width="1.5"/>
          <path d="M9.4 7.4 V16.6 M9.4 12 L14.1 7.4 M9.4 12 L14.1 16.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      <span class="dock-label">Application launcher</span>
    </button>
    <div class="dock-sep"></div>
    <button class="dock-btn" data-app="web" title="Web"><span class="msym">public</span><span class="dock-label">Web</span></button>
    <button class="dock-btn" data-app="games" title="Games"><span class="msym">sports_esports</span><span class="dock-label">Games</span></button>
    <button class="dock-btn" data-app="movies" title="Movies"><span class="msym">movie</span><span class="dock-label">Movies</span></button>
    <button class="dock-btn" data-app="vapps" title="Apps"><span class="msym">apps</span><span class="dock-label">Apps</span></button>
    <button class="dock-btn" data-app="files" title="Files"><span class="msym">folder</span><span class="dock-label">Files</span></button>
    <button class="dock-btn" data-app="assistant" title="Assistant"><span class="msym">smart_toy</span><span class="dock-label">Assistant</span></button>
  </nav>

  <main id="desktop"></main>

  <div id="ctx" class="ctx" hidden></div>

  <script type="module" src="desktop/js/main.js"></script>
</body>
</html>
