<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>movies — velcro</title>
<script src="/theme.js"></script>
<link rel="icon" href="data:," />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sour+Gummy:wght@300..900&family=Nunito:wght@400;600;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/style.css" />
<link rel="manifest" href="/manifest.webmanifest" />
<meta name="theme-color" content="#7151a8" />
<style>
  .movie-card .cover { aspect-ratio: 2 / 3; }

  .movie-modal {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(10, 6, 20, 0.75);
    padding: clamp(12px, 4vw, 40px);
    overflow-y: auto;
  }

  .movie-modal.active { display: flex; }

  .movie-modal-content {
    position: relative;
    width: 100%;
    max-width: 920px;
    max-height: 92vh;
    overflow-y: auto;
    background: var(--bg-elevated);
    border: 2px solid var(--border);
    border-radius: 22px;
    padding: clamp(16px, 3vw, 28px);
    box-shadow: 0 20px 50px var(--shadow);
  }

  .movie-modal-close {
    position: absolute;
    top: 14px;
    right: 14px;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 2px solid var(--border);
    background: var(--bg-elevated-hover);
    color: var(--text);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .movie-modal-close .material-symbols-rounded { font-size: 20px; }

  .movie-modal-head {
    display: flex;
    gap: 20px;
    margin-bottom: 18px;
  }

  .movie-modal-poster {
    width: 130px;
    flex-shrink: 0;
    aspect-ratio: 2 / 3;
    border-radius: 14px;
    overflow: hidden;
    background: var(--accent-soft);
  }

  .movie-modal-poster img { width: 100%; height: 100%; object-fit: cover; }

  .movie-modal-title {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 26px;
    color: var(--text);
    margin: 0 0 6px;
  }

  .movie-modal-meta {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 10px;
  }

  .movie-modal-meta .rating { color: var(--accent-bright); font-weight: 700; }

  .movie-modal-desc {
    font-size: 14px;
    color: var(--text-muted);
    line-height: 1.5;
  }

  .movie-modal-controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }

  .movie-modal-controls select {
    border: 2px solid var(--border);
    background: var(--filter-bg);
    color: var(--filter-text);
    border-radius: 999px;
    padding: 8px 14px;
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
  }

  .movie-modal-frame-wrap {
    width: 100%;
    aspect-ratio: 16 / 9;
    border-radius: 14px;
    overflow: hidden;
    background: #000;
    border: 2px solid var(--border);
  }

  .movie-modal-frame-wrap iframe { width: 100%; height: 100%; border: none; }

  @media (max-width: 560px) {
    .movie-modal-head { flex-direction: column; }
    .movie-modal-poster { width: 100px; }
  }
</style>
</head>
<body>

<script src="/cloak.js"></script>
<script src="/panic.js"></script>
<script src="/account.js"></script>
<script src="/a11y.js"></script>
<script src="/click-glow.js"></script>
<script src="/transitions.js"></script>

<header class="topbar">
  <div class="topbar-right" style="margin-left: auto;">
    <div class="search-wrapper">
      <span class="material-symbols-rounded search-icon">search</span>
      <input id="searchInput" class="search-input" type="text" placeholder="search movies & shows" autocomplete="off" />
    </div>
  </div>
</header>

<nav class="site-nav" style="justify-content: center; padding: 0 20px 20px;">
  <a href="/"><span class="material-symbols-rounded">sports_esports</span>games</a>
  <a href="/apps.html"><span class="material-symbols-rounded">apps</span>apps</a>
  <a href="/movies.html" class="active"><span class="material-symbols-rounded">movie</span>movies</a>
  <a href="/cloud-gaming.html"><span class="material-symbols-rounded">cloud</span>cloud gaming</a>  <a href="/browser.html"><span class="material-symbols-rounded">public</span>browser</a>
  <a href="/chat.html"><span class="material-symbols-rounded">forum</span>chat</a>
  <a href="/credits.html"><span class="material-symbols-rounded">favorite</span>credits</a>
  <a href="/links.html"><span class="material-symbols-rounded">link</span>links</a>
  <a href="https://discord.gg/UWdeD4whhj" target="_blank" rel="noopener"><span class="material-symbols-rounded">forum</span>discord</a>
    <a href="/search.html"><span class="material-symbols-rounded">search</span>search</a>
<a href="/account.html"><span class="material-symbols-rounded">person</span>account</a>
  <a href="/settings.html"><span class="material-symbols-rounded">settings</span>settings</a>
</nav>

<main>
  <section class="hero">
    <h1>movies</h1>
    <p class="tagline">movies & shows, streamed straight in the tab</p>
  </section>

  <section class="controls">
    <div class="category-pills" id="typePills">
      <button class="pill active" data-type="all">all</button>
      <button class="pill" data-type="movie">movies</button>
      <button class="pill" data-type="tv">shows</button>
    </div>
  </section>

  <section class="games-grid" id="moviesGrid">
    <div class="loading-state">
      <div class="spinner"></div>
      <p>loading&hellip;</p>
    </div>
  </section>

  <p class="empty-state" id="emptyState" hidden>nothing matches that &mdash; try a different search</p>
</main>

<div class="movie-modal" id="movieModal">
  <div class="movie-modal-content">
    <button class="movie-modal-close" id="movieModalClose" type="button" aria-label="Close">
      <span class="material-symbols-rounded">close</span>
    </button>
    <div class="movie-modal-head">
      <div class="movie-modal-poster"><img id="modalPoster" src="" alt="" /></div>
      <div>
        <h2 class="movie-modal-title" id="modalTitle"></h2>
        <div class="movie-modal-meta">
          <span id="modalYear"></span>
          <span id="modalType"></span>
          <span class="rating" id="modalRating"></span>
        </div>
        <p class="movie-modal-desc" id="modalDesc"></p>
      </div>
    </div>
    <div class="movie-modal-controls" id="modalControls"></div>
    <div class="movie-modal-frame-wrap">
      <iframe id="modalFrame" allowfullscreen></iframe>
    </div>
  </div>
</div>

<footer>
  <p>velcro</p>
</footer>

<script src="/movies.js"></script>
</body>
</html>
