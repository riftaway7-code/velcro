<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ai — velcro</title>

<link rel="icon" href="data:," />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

<link rel="stylesheet" href="/style.css" />
<link rel="manifest" href="/manifest.webmanifest" />
<meta name="theme-color" content="#7151a8" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/contrib/auto-render.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.5/purify.min.js"></script>
<style>
  .ai-layout {
    display: flex;
    gap: 20px;
    max-width: 1500px;
    margin: 0 auto;
    padding: 0 20px 60px;
    height: calc(100vh - 150px);
    min-height: 420px;
  }

  .chat-main {
    flex: 1 1 0;
    max-width: 1000px;
    margin: 0 auto;
    min-width: 0;
    display: flex;
    flex-direction: column;
  }

  .ai-browser-pane {
    display: none;
    flex: 1 1 0;
    min-width: 340px;
    flex-direction: column;
    border: 2px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    background: var(--bg-elevated);
  }

  .ai-browser-pane.open { display: flex; }

  .ai-browser-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    background: var(--bg-elevated);
    border-bottom: 2px solid var(--border);
    flex-shrink: 0;
  }

  .ai-browser-title {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 14px;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 260px;
  }

  .ai-browser-actions { display: flex; gap: 6px; }

  .ai-browser-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 2px solid var(--border);
    background: var(--bg-elevated);
    color: var(--icon-color);
    text-decoration: none;
    cursor: pointer;
    transition: background 0.2s ease, border-color 0.2s ease;
  }
  .ai-browser-btn:hover { background: var(--bg-elevated-hover); border-color: var(--accent); }
  .ai-browser-btn .material-symbols-rounded { font-size: 17px; }

  .ai-browser-body { position: relative; flex: 1; }

  .ai-browser-frame { position: absolute; inset: 0; width: 100%; height: 100%; border: none; display: block; background: #fff; }

  .ai-browser-loader {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    transition: opacity 0.3s ease;
    z-index: 5;
  }
  .ai-browser-loader.gone { opacity: 0; pointer-events: none; }

  .chat-header-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 0 14px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .chat-title {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 20px;
    color: var(--text);
  }

  .chat-online {
    font-size: 13px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    background: none;
    border: none;
    font-family: var(--font-body);
    padding: 6px 12px;
    border-radius: 999px;
    transition: background 0.15s, color 0.15s;
  }

  .chat-online:hover { background: var(--bg-elevated-hover); color: var(--text); }

  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
    scroll-behavior: smooth;
  }

  .chat-messages::-webkit-scrollbar { width: 5px; }
  .chat-messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .chat-msg { display: flex; flex-direction: column; gap: 2px; max-width: 100%; }

  .chat-msg-meta { display: flex; align-items: baseline; gap: 8px; }

  .chat-msg-name {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 13px;
    color: var(--accent-bright);
  }

  .chat-msg.mine .chat-msg-name { color: var(--accent); }

  .chat-msg-text {
    font-size: 14px;
    color: var(--text);
    line-height: 1.5;
    word-break: break-word;
    padding: 8px 12px;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 0 12px 12px 12px;
    display: inline-block;
    max-width: 92%;
  }

  .chat-msg.mine { align-items: flex-end; }
  .chat-msg.mine .chat-msg-meta { flex-direction: row-reverse; }
  .chat-msg.mine .chat-msg-text {
    background: var(--accent-glow);
    border-color: var(--accent);
    border-radius: 12px 0 12px 12px;
  }

  .chat-msg-text:not(.md) { white-space: pre-wrap; }

  .chat-sys {
    font-size: 12px;
    color: var(--text-muted);
    text-align: center;
    padding: 4px 0;
    font-style: italic;
  }

  .chat-msg-text.md > *:first-child { margin-top: 0; }
  .chat-msg-text.md > *:last-child { margin-bottom: 0; }
  .chat-msg-text.md h1, .chat-msg-text.md h2, .chat-msg-text.md h3 {
    font-family: var(--font-display);
    font-weight: 700;
    margin: 14px 0 6px;
    line-height: 1.3;
  }
  .chat-msg-text.md h1 { font-size: 18px; }
  .chat-msg-text.md h2 { font-size: 16px; }
  .chat-msg-text.md h3 { font-size: 14.5px; }
  .chat-msg-text.md p { margin: 8px 0; }
  .chat-msg-text.md strong { color: var(--accent-bright); }
  .chat-msg-text.md ul, .chat-msg-text.md ol { margin: 8px 0; padding-left: 22px; }
  .chat-msg-text.md li { margin: 3px 0; }
  .chat-msg-text.md hr { border: none; border-top: 1px solid var(--border); margin: 14px 0; }
  .chat-msg-text.md code {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 5px;
    font-size: 13px;
  }
  .chat-msg-text.md pre {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    overflow-x: auto;
    margin: 8px 0;
  }
  .chat-msg-text.md pre code { background: none; border: none; padding: 0; }
  .chat-msg-text.md blockquote {
    border-left: 3px solid var(--accent);
    margin: 8px 0;
    padding: 2px 12px;
    color: var(--text-muted);
  }
  .chat-msg-text.md table { border-collapse: collapse; margin: 8px 0; font-size: 13px; display: block; max-width: 100%; overflow-x: auto; white-space: nowrap; }
  .chat-msg-text.md th, .chat-msg-text.md td { border: 1px solid var(--border); padding: 4px 8px; }
  .chat-msg-text.md a { color: var(--accent-bright); }
  .chat-msg-text.md .katex { font-size: 1.05em; }
  .chat-msg-text.md .katex-display { margin: 10px 0; overflow-x: auto; overflow-y: hidden; }

  #aiTypingLabel { color: var(--text-muted); font-size: 13px; font-style: italic; }
  .ai-typing { display: inline-flex; gap: 4px; padding: 4px 2px; }
  .ai-typing span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--text-muted);
    animation: aiTypingBounce 1.2s infinite ease-in-out;
  }
  .ai-typing span:nth-child(2) { animation-delay: 0.15s; }
  .ai-typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes aiTypingBounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  .chat-input-area {
    flex-shrink: 0;
    padding: 14px 0 0;
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .chat-send-row { display: flex; gap: 8px; }

  .chat-text-input {
    flex: 1;
    background: var(--bg-elevated);
    border: 2px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: var(--font-body);
    font-size: 14px;
    padding: 10px 14px;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }

  .chat-text-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }

  .chat-text-input::placeholder { color: var(--text-muted); }

  .chat-send-btn {
    background: var(--accent);
    border: none;
    border-radius: 10px;
    color: var(--bg);
    font-family: var(--font-body);
    font-size: 14px;
    font-weight: 700;
    padding: 10px 20px;
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    transition: background 0.15s;
  }

  .chat-send-btn:hover { background: var(--accent-bright); }
  .chat-send-btn:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>

<script src="/unload-guard.js"></script>
<script src="/cloak.js"></script>

  <button id="scrollTop" class="scroll-top" type="button" aria-label="Scroll to top">
    <span class="material-symbols-rounded">arrow_upward</span>
  </button>
  <nav class="site-nav">

  <div class="topbar-right">
    <button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle theme">
      <span class="material-symbols-rounded">dark_mode</span>
    </button>
  </div>
</header>

<main class="ai-layout">
  <div class="chat-main">
    <div class="chat-header-bar">
      <span class="chat-title">ai chat</span>
      <button class="chat-online" id="aiNewChat" type="button" title="Start a new conversation">
        <span class="material-symbols-rounded" style="font-size: 16px;">refresh</span>
        new chat
      </button>
    </div>

    <div class="chat-messages" id="chatMessages">
      <div class="chat-sys">ask anything — this is one continuous conversation until you start a new chat</div>
    </div>

    <div class="chat-input-area">
      <div class="chat-send-row">
        <input class="chat-text-input" id="chatTextInput" placeholder="message the ai…" maxlength="2000" autocomplete="off" />
        <button class="chat-send-btn" id="chatSendBtn" type="button">
          <span class="material-symbols-rounded" style="font-size: 18px;">send</span>
          send
        </button>
      </div>
    </div>
  </div>

  <div class="ai-browser-pane" id="aiBrowserPane">
    <div class="ai-browser-bar">
      <span class="ai-browser-title" id="aiBrowserTitle">browser</span>
      <div class="ai-browser-actions">
        <button class="ai-browser-btn" id="aiBrowserOpenTab" type="button" title="Open in a full browser tab">
          <span class="material-symbols-rounded">open_in_new</span>
        </button>
        <button class="ai-browser-btn" id="aiBrowserClose" type="button" title="Close">
          <span class="material-symbols-rounded">close</span>
        </button>
      </div>
    </div>
    <div class="ai-browser-body">
      <iframe id="aiBrowserFrame" class="ai-browser-frame" allowfullscreen></iframe>
      <div class="ai-browser-loader" id="aiBrowserLoader">
        <div class="spinner"></div>
      </div>
    </div>
  </div>
</main>

<script src="/ai.js"></script>
